name: niksam
description: "Offline-first Flutter task manager with atomic persistence, change detection and fault injection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.6
  path: ^1.9.1
  uuid: ^4.6.0
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
